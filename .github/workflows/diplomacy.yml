name: Diplomacy Bot

on:
  schedule:
    # Запуск кожні 3 години
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Завантаження репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Встановлення бібліотек
        working-directory: diplomacy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск бота
        working-directory: diplomacy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DIPLOMACY_CHANNEL_ID: ${{ secrets.DIPLOMACY_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py

      - name: Збереження історії в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add diplomacy/posted_news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Оновлено історію дипломатичних публікацій [skip ci]"
          git push
