name: Diplomacy Bot

on:
  workflow_dispatch:

# Єдина черга: спільна історія не перезаписується паралельними запусками.
concurrency:
  group: osintbots-shared-news-history
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Завантаження репозиторію
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Встановлення бібліотек
        working-directory: diplomacy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск бота
        working-directory: diplomacy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DIPLOMACY_CHANNEL_ID: ${{ secrets.DIPLOMACY_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: grok-4.3
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemma-4-31b-it:free
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python bot.py

      - name: Збереження історії в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add diplomacy/posted_news.json shared_news_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Оновлено історію дипломатичних публікацій [skip ci]"
          # Синхронізуємося з актуальним main без відкидання локальних записів.
          git fetch origin main
          if ! git rebase origin/main; then
            python scripts/merge_shared_history_conflict.py
            git add shared_news_history.json
            GIT_EDITOR=true git rebase --continue
          fi

          # Відправляємо коміт без перезапису чужих змін.
          git push origin HEAD:main
