name: Economy Bot

on:
  schedule:
    - cron: '35 */2 * * *'  
  workflow_dispatch:

# Єдина черга: спільна історія не перезаписується паралельними запусками.
concurrency:
  group: osintbots-shared-news-history
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Завантаження репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Встановлення бібліотек
        working-directory: economy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск бота
        working-directory: economy 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEOECONOMICS_CHANNEL_ID: ${{ secrets.GEOECONOMICS_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py

      - name: Збереження історії в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add economy/posted_news.json shared_news_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Оновлено макроекономічну історію [skip ci]"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
