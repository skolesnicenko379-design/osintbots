name: MilTech Bot

on:
  schedule:
    # Запуск щогодини (на на 17 хвилині початку кожної години)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Кнопка для ручного запуску

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дозвіл на перезапис файлу posted_news.json

    steps:
      - name: Завантаження репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Встановлення бібліотек
        working-directory: miltech # Вказуємо папку, де лежить requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск бота
        working-directory: miltech # Вказуємо папку, де лежить bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py

      - name: Збереження історії в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add miltech/posted_news.json # Вказуємо точний шлях до файлу історії
          # Зберігаємо файл у репозиторій, якщо були нові публікації
          git diff --quiet && git diff --staged --quiet || git commit -m "Оновлено історію публікацій [skip ci]"
          git push
