
name: MilTech Bot

on:
  schedule:
    - cron: '25 */2 * * *'
  workflow_dispatch:

# Не допускаємо одночасного виконання цього workflow
concurrency:
  group: miltech-bot-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Завантаження репозиторію
      - name: Завантаження репозиторію
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Налаштування Python
      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Встановлення залежностей
      - name: Встановлення бібліотек
        working-directory: miltech
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запуск бота
      - name: Запуск бота
        working-directory: miltech
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py

      # 5. Збереження історії публікацій
      - name: Збереження історії в GitHub
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Додаємо історію публікацій до коміту
          git add miltech/posted_news.json

          # Якщо файл не змінився, завершуємо крок без коміту
          if git diff --cached --quiet; then
            echo "Нових змін в історії публікацій немає."
            exit 0
          fi

          # Створюємо коміт зі змінами
          git commit -m "Оновлено історію публікацій [skip ci]"

          # Отримуємо останні зміни з GitHub
          git fetch origin main

          # Переносимо коміт поверх актуальної версії main
          git rebase origin/main

          # Відправляємо зміни без перезапису чужих комітів
          git push origin HEAD:main
