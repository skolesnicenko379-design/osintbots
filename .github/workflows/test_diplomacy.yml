name: Diplomacy validation tests

on:
  pull_request:
    paths:
      - "diplomacy/**"
      - ".github/workflows/test_diplomacy.yml"
  push:
    branches: [main]
    paths:
      - "diplomacy/**"
      - ".github/workflows/test_diplomacy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        working-directory: diplomacy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile bot and run validation tests
        working-directory: diplomacy
        run: |
          python -m py_compile bot.py
          python -m unittest -v test_bot_validation.py
