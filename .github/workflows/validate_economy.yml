name: Validate Economy Bot Syntax

on:
  push:
    paths:
      - 'economy/bot.py'
      - '.github/workflows/validate_economy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile without running the bot
        run: python -m py_compile economy/bot.py
